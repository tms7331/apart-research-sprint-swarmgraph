[project]
name = "swarmgraph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: explicit PDF rendering, compilation, and process integration checks (pytest -m integration)"]

[dependency-groups]
dev = [
    "pypdf==6.19.0",
    "pytest>=9.2.0",
]
paper = [
    "typst==0.15.0",
]

[tool.uv]
default-groups = ["dev", "paper"]  # paper: bin/build-paper's Typst compiler
